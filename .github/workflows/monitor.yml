name: Giants Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check Giants resale
        run: |
          python - <<'PY'
          import urllib.request
          import re
          import html
          import json

          url = "https://tradead.tixplus.jp/giants/buy/bidding/listings/2192"

          req = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "Mozilla/5.0 (iPhone; CPU iPhone OS 26_6 like Mac OS X) AppleWebKit/605.1.15 Safari/604.1"
              }
          )

          data = urllib.request.urlopen(req, timeout=30).read().decode("utf-8", errors="ignore")

          print("HTTP取得成功")
          print("data-page:", "data-page=" in data)

          m = re.search(r'data-page="([^"]+)"', data)

          if not m:
              print("data-pageが見つかりません")
              raise SystemExit(1)

          decoded = html.unescape(m.group(1))
          obj = json.loads(decoded)

          print(json.dumps(obj, ensure_ascii=False)[:10000])
          PY
