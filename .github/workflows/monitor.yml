name: Giants Monitor

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check GIANTS 2192
        run: |
          python - <<'PY'
          import urllib.request
          import re

          url = "https://tradead.tixplus.jp/giants/buy/bidding/listings/2192"

          req = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "Mozilla/5.0"
              }
          )

          try:
              with urllib.request.urlopen(req, timeout=30) as response:
                  body = response.read().decode("utf-8", errors="ignore")

              print("HTTP取得成功")
              print("ページサイズ:", len(body))
              print("0出品:", "0出品" in body)
              print("listings_count:", "listings_count" in body)

              matches = re.findall(
                  r".{0,100}(?:0出品|listings_count).{0,150}",
                  body
              )

              for match in matches[:20]:
                  print(match)

          except Exception as e:
              print("取得失敗:", repr(e))
              raise
          PY
