name: Giants Monitor

"on":
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check GIANTS 2192
        run: |
          python - <<'PY'
          import urllib.request
          import re

          url = "https://tradead.tixplus.jp/giants/buy/bidding/listings/2192"

          req = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "Mozilla/5.0"
              }
          )

          try:
              data = urllib.request.urlopen(req, timeout=30).read().decode(
                  "utf-8", errors="ignore"
              )

              print("HTTP取得成功")
              print("ページサイズ:", len(data))
              print("0出品:", "0出品" in data)
              print("listings_count:", "listings_count" in data)

              numbers = re.findall(r'.{0,80}(?:0出品|listings_count).{0,120}', data)

              for x in numbers[:20]:
                  print(x)

          except Exception as e:
              print("取得失敗:", repr(e))
              raise
          PY
