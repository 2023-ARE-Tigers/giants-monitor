name: Giants Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check GIANTS 2192
        run: |
          python - <<'PY'
          import urllib.request

          url = "https://tradead.tixplus.jp/giants/buy/bidding/listings/2192"

          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/142.0 Safari/537.36",
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
              "Accept-Language": "ja,en-US;q=0.9,en;q=0.8",
              "Referer": "https://tradead.tixplus.jp/giants/"
          }

          req = urllib.request.Request(url, headers=headers)

          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  body = r.read().decode("utf-8", errors="ignore")
                  print("HTTP:", r.status)
                  print("サイズ:", len(body))
                  print(body)
          except Exception as e:
              print("ERROR:", repr(e))
              raise
          PY
